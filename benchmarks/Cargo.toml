[package]
name = "ledgerfs-benchmarks"
version = "0.1.0"
edition = "2024"
# Higher than the two published crates' 1.89, and deliberately: `redb` 4.4
# declares 1.90. This crate is `publish = false` and is not part of anyone's
# dependency graph, so the comparison engine sets the floor here rather than
# the other way round.
rust-version = "1.90"
publish = false
description = "The cross-engine comparison harness: LedgerFS against SQLite, redb, and a raw fsync'd file."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sing-Security/ledgerfs"

[features]
default = ["sqlite", "redb"]
# One feature per comparison engine. A deployment that only compares against
# SQLite builds with `--no-default-features --features sqlite`: no redb code
# is compiled, linked, or in the binary — the same per-deployment rule the
# engines' own users follow. `ledgerfs` and `raw-file` are always present;
# one is the subject and the other is the control.
sqlite = ["dep:rusqlite"]
redb = ["dep:redb"]

[dependencies]
ledgerfs-host = { path = "../host" }

# -- The engines LedgerFS is compared against.
#
# `rusqlite` with `bundled`: SQLite compiled from its own amalgamation, so the
# number does not depend on whichever libsqlite3 the host happens to have.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
redb = { version = "4", optional = true }
# -- The medium record. `statfs` for the filesystem magic (so a tmpfs can be
# refused rather than silently benchmarked) and `/proc/self/mountinfo` for the
# device behind the path. There is no std API for either.
libc = "0.2"
# -- Result serialisation. One JSON file per run, checked in, rendered into
# BENCHMARKS.md by a separate renderer so the document cannot drift from the
# harness that produced it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
