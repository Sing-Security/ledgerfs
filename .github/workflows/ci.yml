# .github/workflows/ci.yml
#
# The kernel crate is `no_std` with a feature matrix and the host crate is a
# plain `std` consumer of it, so there are two shapes of breakage to catch:
# a feature that only compiles in the all-on build, and a kernel change that
# compiles here but not from the host crate's side. The matrix and the host job
# cover the first; the lint job, which builds `--all-targets`, covers the second.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `rust-toolchain.toml` pins this repository to `stable` plus rustfmt and
# clippy, so every `cargo` invocation below — including the ones under a
# `rustup show` step — resolves to that toolchain without an install action.
env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    name: kernel (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per declared feature, plus the empty and all-on builds.
        # `reader` and `data-encryption` are the ones that bite: the first
        # compiles ring-0 port I/O and only on x86_64, the second replaces the
        # block device underneath the whole CoW object model.
        include:
          - { name: none,            flags: "--no-default-features" }
          - { name: default,         flags: "" }
          - { name: reader,          flags: "--no-default-features --features reader" }
          - { name: std,             flags: "--no-default-features --features std" }
          - { name: data-encryption, flags: "--no-default-features --features data-encryption" }
          - { name: temper-sealing,  flags: "--no-default-features --features temper_sealing" }
          - { name: all,             flags: "--all-features" }
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test -p ledgerfs ${{ matrix.flags }}

  host:
    name: host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test -p ledgerfs-host

  # The host crate advertises Linux, macOS and Windows: the file device's
  # positioned I/O and lock are cfg-gated per family, not Unix-assumed. This
  # job is what keeps that true — it runs the same suite on a native runner,
  # exercising `seek_read`/`seek_write`, `try_lock`, and the creation-time
  # volume identity against a real Windows kernel instead of a cross-check.
  host-windows:
    name: host (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test -p ledgerfs-host
      # The `rust-version` floor applies on Windows too; checked here rather
      # than in the msrv job because a cross-check from Linux cannot run the
      # third-party build scripts a windows-gnu target needs a mingw gcc for.
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check -p ledgerfs-host

  # `pending/` is not published, but its tests are the only thing keeping the
  # subsystems it holds honest — nothing in the shipping path calls them, so
  # nothing else would notice if they rotted.
  pending:
    name: pending
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test -p ledgerfs-pending

  # `rust-version` in a manifest is a published claim — "this builds on 1.89" —
  # and nothing else in this file compiles anywhere near it. Both published
  # crates are built here at their declared floor; `+1.89` overrides the
  # `stable` pin in `rust-toolchain.toml` for these commands only.
  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 build -p ledgerfs --no-default-features
      - run: cargo +1.89 build -p ledgerfs --all-features
      - run: cargo +1.89 build -p ledgerfs-host
      - run: cargo +1.89 build -p ledgerfs-pending

  # The benchmark harness is not published, but it is the source of every number
  # in BENCHMARKS.md, so a change that breaks it breaks the published claims.
  # Build only — running it on a shared runner measures the runner.
  benchmarks:
    name: benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build -p ledgerfs-benchmarks --release

  # A feature declared but compiled by no job is how breakage hides. Fail if one
  # is added to the kernel manifest and not to the matrix above.
  matrix-covers-every-feature:
    name: every declared feature is in the matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          declared=$(sed -n '/^\[features\]/,/^\[/p' kernel/Cargo.toml \
                     | grep -oE '^[a-z0-9_-]+ = ' | sed 's/ = //' | sort -u)
          covered=$(grep -oE -e '--features [a-z0-9_,-]+' -e '--all-features' .github/workflows/ci.yml \
                    | tr ',' '\n' | grep -oE '[a-z0-9_-]+$' | sort -u)
          exempt=$(printf 'default\nall-features\n')
          missing=$(comm -23 <(echo "$declared") <(sort -u <(echo "$covered") <(echo "$exempt")))
          if [ -n "$missing" ]; then
            echo "::error::Declared but never compiled:"
            echo "$missing" | sed 's/^/  - /'
            exit 1
          fi
          echo "All declared features are covered."

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      # --all-targets so the tests, examples and benches are linted too; without
      # it clippy only sees the libraries. The kernel denies
      # undocumented_unsafe_blocks in its own manifest, and this makes the same
      # rule binding on the host crate, where unsafe is forbidden outright but
      # the examples and benches are separate crates that could reintroduce it.
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
