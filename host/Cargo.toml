[package]
name = "ledgerfs-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "LedgerFS: the std host with mkfs, mount and mutation verbs over any BlockDevice."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sing-Security/ledgerfs"
readme = "README.md"
keywords = ["filesystem", "copy-on-write", "content-addressed", "embedded", "storage"]
categories = ["filesystem", "embedded"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# -- LedgerFS on-disk format (superblock, ObjectRecord framing, object model,
#    CoW operations). `std` pulls the lz4/zstd decoders that `compression.rs`
#    gates, so a record written with either policy decodes. Deliberately NOT
#    `reader` (that compiles ring-0 ATA port I/O into a userspace binary) and
#    not `data-encryption` (see lib.rs, "Boundaries").
ledgerfs = { path = "../kernel", version = "0.7", features = ["std"] }

[dev-dependencies]
# The benchmark harness for `benches/store.rs`: one group per `Store` action.
# `html_reports` writes the per-benchmark report under `target/criterion`.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "store"
harness = false
