[package]
name = "ledgerfs-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "LedgerFS: the std host with mkfs, mount and mutation verbs over any BlockDevice."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sing-Security/ledgerfs"
readme = "README.md"
keywords = ["filesystem", "copy-on-write", "content-addressed", "embedded", "storage"]
categories = ["filesystem", "embedded"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# -- LedgerFS on-disk format (superblock, ObjectRecord framing, object model,
#    CoW operations). `std` pulls the lz4/zstd decoders that `compression.rs`
#    gates, so a record written with either policy decodes. `data-encryption`
#    is enabled because this crate can now format and open an encrypted volume
#    as a first-class operation (`Store::format_encrypted` /
#    `Store::open_encrypted`); without the cipher compiled in, the format crate
#    would refuse the volume at `Superblock::decode` instead. Deliberately NOT
#    `reader` (that compiles ring-0 ATA port I/O into a userspace binary).
ledgerfs = { path = "../kernel", version = "0.7", features = ["std", "data-encryption"] }
# -- Entropy for the master key, keyslot salts and wrap IVs. `getrandom` asks
#    the operating system; there is no userspace CSPRNG in `std`.
getrandom = "0.3"
# -- Key material is wiped when the store that owns it goes away.
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
# The benchmark harness for `benches/store.rs`: one group per `Store` action.
# `html_reports` writes the per-benchmark report under `target/criterion`.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "store"
harness = false
