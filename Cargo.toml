# Two published crates and two that are not:
#
#   kernel/      ledgerfs            — the on-disk format and CoW ops, no_std
#   host/        ledgerfs-host       — the std volume layer over a BlockDevice
#   pending/     ledgerfs-pending    — Tier B subsystems, publish = false
#   benchmarks/  ledgerfs-benchmarks — the comparison harness, publish = false
#
# They share a lockfile and a target directory and nothing else; each carries its
# own metadata and its own version, because the kernel's is tied to the on-disk
# format and the host's is not.

[workspace]
members = ["kernel", "host", "pending", "benchmarks"]
resolver = "2"

# The release profile the comparison harness and the crate benchmarks run under.
# `debug` symbols stay on so a benchmark that lands can still be profiled
# afterwards without a second build.
[profile.bench]
inherits = "release"
debug = true
